name: Make PR With GitHub App

on:
    merge_group: {}
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    workflow_dispatch: {}

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    cron-rustc-pull:
        name: automatic pull from rustc
        runs-on: ubuntu-latest
        if: ${{ true }}
        steps:
            - name: setup bot git name and email
              run: |
                  git config --global user.name 'The Miri Cronjob Bot'
                  git config --global user.email 'miri@cron.bot'
            # Create a token for the next step so it can create a PR that actually runs CI.
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  permission-contents: write # The cronjob needs to be able to push to the repo...
                  permission-pull-requests: write # ... and create a PR.
                  client-id: ${{ vars.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - name: Setup `git` as bot
              run: gh auth setup-git
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
            - run: cat ./.git/config
            - run: git config --list --show-origin
            - name: pull changes from rustc and create PR
              run: |
                  echo "you really are an idiot, aren't you?" > what_she_said.txt

                  git add what_she_said.txt

                  git commit -m "idiot: mail for you!"

                  # Store merge commit message
                  git log -1 --pretty=%B > message.txt


                  # Create a PR
                  BRANCH="idiot-$(date -u +%Y-%m-%d-%N)"
                  git switch -c $BRANCH
                  git push -u origin $BRANCH
                  gh pr create -B master --title 'IF OPENED, CLOSE ME!' --body-file message.txt
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
